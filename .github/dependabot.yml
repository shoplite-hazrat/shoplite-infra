version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    commit-message: { prefix: "chore(ci)" }
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: terraform
    directory: /terraform/kind
    schedule: { interval: weekly, day: monday }
    commit-message: { prefix: "chore(deps)" }
